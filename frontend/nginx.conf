# SPA static hosting + reverse proxy to the backend API.
# Installed at /etc/nginx/conf.d/app.conf inside the frontend image.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Face capture posts base64-encoded images; allow generous request bodies.
    # (Backend also enforces MAX_REQUEST_BYTES, default 8 MB.)
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the backend service on the compose network.
    # location "/api/" + proxy_pass without a URI keeps the full /api/... path.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Vite emits content-hashed files under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
